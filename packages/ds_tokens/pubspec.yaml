name: wakeup_ds_tokens
description: Token design system của Wakeup, sinh 1-1 từ Figma Variables (ADR-0008).
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Inter 4.1 (SIL OFL 1.1, fonts/inter/OFL.txt), DS-05. App dùng qua
  # DsFont.family + DsFont.package.
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: fonts/inter/Inter-SemiBold.ttf
          weight: 600
